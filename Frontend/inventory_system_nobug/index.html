<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory System</title>

  <!-- Favicon (the small icon on the browser tab) -->
  <link rel="icon" type="image/png" href="images/logo_4k.png" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="panel">
    <main class="login-card">
      <img src="images/logo_4k.png" alt="Inventory System logo" class="logo" />
      <p class="system-name">Inventory System</p>

      <h1>Login</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="username@gmail.com" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                <line class="eye-slash" x1="3" y1="3" x2="21" y2="21" />
              </svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot">Forgot Password?</a>

        <p id="errorMsg" class="error" role="alert" hidden></p>

        <button type="submit" class="btn-signin">Sign in</button>
      </form>
    </main>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
